<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>AgentBoard</title>
<style>
:root{
  --bg:#f4f5f8;--surface:#fff;--surface-2:#f8f9fb;--col:#eceef3;--text:#1b1f2a;--muted:#5b6475;--line:#d9dde6;--line-strong:#b9bfcc;
  --accent:#4f46e5;--accent-text:#fff;--accent-soft:#e8e7fd;
  --ok:#0f7a4a;--ok-soft:#dcf3e8;--warn:#92580a;--warn-soft:#fdf0d5;--bad:#b42318;--bad-soft:#fde4e1;--info-soft:#e3effd;--info:#1d4f91;
  --p-low:#5b6475;--p-medium:#1d4f91;--p-high:#92580a;--p-urgent:#b42318;
  --shadow:0 1px 2px rgba(20,24,40,.08),0 1px 3px rgba(20,24,40,.06);
  --radius:10px;--focus:0 0 0 3px rgba(79,70,229,.45);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12141b;--surface:#1c1f29;--surface-2:#222633;--col:#171a22;--text:#e8eaf0;--muted:#a1a8b8;--line:#2d3240;--line-strong:#454c60;
  --accent:#8b85ff;--accent-text:#12141b;--accent-soft:#2a2850;
  --ok:#5fd6a0;--ok-soft:#12362a;--warn:#f1be64;--warn-soft:#3a2d12;--bad:#ff8f84;--bad-soft:#431c19;--info:#8dbcf5;--info-soft:#16304f;
  --p-low:#a1a8b8;--p-medium:#8dbcf5;--p-high:#f1be64;--p-urgent:#ff8f84;
  --shadow:0 1px 2px rgba(0,0,0,.4);--focus:0 0 0 3px rgba(139,133,255,.55);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
#view-board[aria-pressed="true"],#view-features[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.wrap-any{overflow-wrap:anywhere;word-break:break-word}

#app{display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:18px;margin:0;overflow-wrap:anywhere}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-text);padding:8px 12px;border:0;border-radius:6px;z-index:100}
.skip:focus{left:8px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:28px;padding:2px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}

.conn{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:13px}
.conn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.conn[data-state=ok] .dot{background:var(--ok)}
.conn[data-state=error] .dot{background:var(--bad)}
.conn[data-state=connecting] .dot{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.conn button{border:0;background:none;padding:0 2px;color:var(--accent);font-weight:600;text-decoration:underline}

#notices{display:flex;flex-direction:column;gap:8px;padding:0 20px}
#notices:not(:empty){padding-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid transparent;background:var(--info-soft);color:var(--text)}
.alert[hidden]{display:none}
.alert>.a-icon{font-weight:700}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.error{background:var(--bad-soft);border-color:var(--bad)}
.alert.info{background:var(--info-soft);border-color:var(--info)}
.alert .a-body{flex:1;min-width:0}
.alert .a-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.alert h3{margin:0 0 2px;font-size:14px}
.alert p{margin:2px 0}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px}
.toolbar input[type=search]{flex:1 1 220px;min-width:160px}
.toolbar input,.toolbar select,.field input[type=text],.field select,.field textarea{min-height:36px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%}
#feature-archive-label{display:flex;align-items:center;gap:6px}
#feature-archive-label[hidden]{display:none}
#feature-archived{width:20px;min-height:20px;height:20px;padding:0;accent-color:var(--accent)}
.toolbar select{width:auto;max-width:200px}
.toolbar .summary{margin-left:auto;color:var(--muted);font-size:13px}
#drafts-strip{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 8px;align-items:center}
#drafts-strip:empty{display:none}

#board{flex:1;display:flex;gap:14px;padding:4px 20px 20px;overflow-x:auto;align-items:flex-start;min-height:0}
#board:focus{outline:none}
.col{flex:1 0 190px;min-width:190px;max-width:340px;background:var(--col);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100dvh - 220px);min-height:120px;border:1px solid transparent}
.col[data-col="needs-grilling"]{border-color:var(--accent)}
.col.missing{border:1px dashed var(--bad);background:var(--bad-soft)}
.col.drop-ok{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px}
.col-head h2{font-size:14px;margin:0;flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.col-head h2 span.name{overflow-wrap:anywhere}
.count{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:0 8px;border-radius:999px}
.col-toggle{display:none;border:0;background:none;padding:4px 8px;font-size:16px}
.col-body{list-style:none;margin:0;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:48px}
.col-empty{color:var(--muted);font-size:13px;padding:10px 6px;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:grab;position:relative}
.card.dragging{opacity:.45}
.card.archived{opacity:.75;border-style:dashed}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .id{font-size:12px;color:var(--muted)}
.card-title{display:block;text-align:left;border:0;background:none;padding:0;font-weight:600;font-size:14px;line-height:1.35;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
.card-title:hover{text-decoration:underline}
.prio{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:5px;border:1px solid currentColor;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio-low{color:var(--p-low)}.prio-medium{color:var(--p-medium)}.prio-high{color:var(--p-high)}.prio-urgent{color:var(--p-urgent)}.prio-unknown{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}
.label{font-size:12px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--text);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.assignee{border:1px dashed var(--line-strong);background:none;border-radius:999px;padding:1px 10px;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:26px}
.assignee.set{border-style:solid;background:var(--surface-2)}
.crit{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.crit .bar{width:36px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block}
.crit .bar i{display:block;height:100%;background:var(--ok)}
.card-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.move{min-height:30px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:12px;max-width:128px}

.empty-panel{margin:40px auto;max-width:560px;text-align:center;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.empty-panel h2{margin:0 0 6px}
.panel{margin:24px auto;max-width:720px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:100%}
.panel h2{margin-top:0}
.panel pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.skeleton{flex:0 0 300px;height:240px;border-radius:var(--radius);background:linear-gradient(90deg,var(--col),var(--surface-2),var(--col));background-size:200% 100%;animation:sk 1.4s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.hint{padding:6px 20px 14px;color:var(--muted);font-size:12px}
kbd{font:inherit;font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:1000;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--text);color:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.error{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.toast .toast-msg{flex:1;overflow-wrap:anywhere}
.toast-x{border:0;background:none;color:inherit;font-size:16px;line-height:1;padding:0 4px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,20,.5)}
#editor{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(680px,100vw);max-width:100vw;border-radius:12px 0 0 12px}
#editor[open]{display:flex}
#ed-form{display:flex;flex-direction:column;width:100%;min-height:0;height:100%}
.ed-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ed-head h2{margin:0;font-size:16px;flex:1;min-width:0}
.ed-head .meta{font-size:12px;color:var(--muted)}
.x{border:0;background:none;font-size:22px;line-height:1;padding:4px 10px;border-radius:6px;min-width:36px;min-height:36px}
.x:hover{background:var(--surface-2)}
.ed-alerts{display:flex;flex-direction:column;gap:8px;padding:0 18px}
.ed-alerts:not(:empty){padding-top:12px}
.ed-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.ed-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ed-foot .note{flex:1 1 200px;font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:13px}
#thread-panel input,#thread-panel textarea{display:block;width:100%;padding:6px 10px;margin:6px 0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
#thread-panel textarea{min-height:70px;resize:vertical}
.thread-entry{padding:10px 0;border-bottom:1px solid var(--line)}
.thread-entry p{margin:8px 0}
#thread-panel button{margin:4px 4px 4px 0}
.field textarea{min-height:110px;resize:vertical;max-height:60vh;font-family:inherit}
.field .help,.counter{font-size:12px;color:var(--muted)}
.counter{text-align:right}
.counter.near{color:var(--warn);font-weight:600}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.err{color:var(--bad);font-size:12px;min-height:0}
.err:empty{display:none}
[aria-invalid=true]{border-color:var(--bad)!important}
.chips-ed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0;margin:0;list-style:none}
.chips-ed .chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:999px;padding:0 4px 0 10px;max-width:100%}
.chips-ed .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chips-ed .chip button{border:0;background:none;padding:2px 6px;font-size:16px;line-height:1}
.inline-add{display:flex;gap:8px}
.crit-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crit-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center}
.crit-row input[type=checkbox],.check input{width:20px;height:20px;accent-color:var(--accent)}
.crit-row .err{grid-column:2 / 4}
.crit-btns{display:flex;gap:2px}
.crit-btns button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:30px;min-height:30px}
.check{display:flex;gap:10px;align-items:flex-start}
dl.meta-list{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px;color:var(--muted)}
dl.meta-list dd{margin:0;overflow-wrap:anywhere}
details.draft-text textarea{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:6px}
#feature-form ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
#feature-form li button{width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px}
#feature-editor{width:min(680px,calc(100vw - 24px));max-height:90dvh;overflow:auto}
#confirm,#assign{width:min(440px,calc(100vw - 24px))}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:16px}
.dlg p{margin:0;overflow-wrap:anywhere}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:720px){
  .top,.toolbar,#notices,#drafts-strip,.hint{padding-left:12px;padding-right:12px}
  #board{flex-direction:column;overflow-x:visible;padding:4px 12px 20px;align-items:stretch}
  .col,.skeleton{flex:none;width:100%;min-width:0;max-width:none;max-height:none}
  .col-toggle{display:inline-block}
  .col.collapsed .col-body{display:none}
  .col-body{overflow:visible}
  .toolbar select{max-width:100%;min-width:0;flex:1 1 140px}
  .toolbar .summary{margin-left:0;flex-basis:100%}
  #editor{width:100vw;border-radius:0}
  .row3{grid-template-columns:1fr}
  .btn,.move,.assignee{min-height:44px}
  .btn.small{min-height:40px}
  .card-title{padding:8px 0}
  .card-actions .move{max-width:none;flex:1 1 120px}
  .x{min-width:44px;min-height:44px}
  .crit-btns button{min-width:40px;min-height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<button type="button" class="skip" id="skip">Skip to board</button>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1 id="board-name">AgentBoard</h1>
      <span id="mode-badge" class="badge" hidden></span>
    </div>
    <div class="top-actions">
      <div id="conn" class="conn" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="conn-text">Connecting…</span><button type="button" id="conn-retry" hidden>Retry now</button></div>
      <button type="button" id="new-card" class="btn primary" disabled>+ New card</button>
    </div>
  </header>
  <nav class="toolbar" aria-label="Views">
    <button type="button" class="btn" id="view-board" aria-pressed="true">Board</button>
    <button type="button" class="btn" id="view-features" aria-pressed="false">Features</button>
    <button type="button" class="btn" id="view-issues" aria-pressed="false">Issues</button>
    <button type="button" class="btn primary" id="new-feature" hidden>+ New feature</button>
    <label id="feature-archive-label" hidden><input type="checkbox" id="feature-archived"> Show archived</label>
  </nav>
  <div id="notices"></div>
  <section class="toolbar" id="toolbar" aria-label="Search and filters" hidden>
    <input type="search" id="q" placeholder="Search title, ID, labels, notes…  ( / )" aria-label="Search cards" autocomplete="off">
    <select id="f-priority" aria-label="Filter by priority"></select>
    <select id="f-assignee" aria-label="Filter by assignee"></select>
    <select id="f-label" aria-label="Filter by label"></select>
    <select id="f-feature" aria-label="Filter by feature"></select>
    <select id="f-archived" aria-label="Archived cards">
      <option value="hide">Hide archived</option>
      <option value="show">Show archived too</option>
      <option value="only">Archived only</option>
    </select>
    <button type="button" class="btn small ghost" id="f-clear" hidden>Clear filters</button>
    <span class="summary" id="summary"></span>
  </section>
  <div id="drafts-strip" aria-label="Unsaved drafts"></div>
  <main id="board" tabindex="-1" aria-label="Board"></main>
  <p class="hint" id="shortcuts" hidden><kbd>/</kbd> search · <kbd>n</kbd> new card · <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> on a focused card title moves it between columns · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves in the editor · <kbd>Esc</kbd> closes (drafts are kept). Cards are sorted by priority, then most recently updated.</p>
</div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="toasts" aria-live="polite"></div>
<datalist id="dl-assignees"></datalist>
<datalist id="dl-labels"></datalist>
<dialog id="editor" aria-labelledby="ed-heading"><form id="ed-form" novalidate></form></dialog>
<dialog id="feature-editor" aria-label="Feature editor"><form class="dlg" id="feature-form"></form></dialog>
<dialog id="confirm" aria-labelledby="cf-title"><form method="dialog" class="dlg" id="cf-form"></form></dialog>
<dialog id="assign" aria-labelledby="as-title"><form method="dialog" class="dlg" id="as-form"></form></dialog>

<script>
'use strict';
(() => {
/* ====================================================================
 * AgentBoard UI. Every piece of board data is untrusted: the DOM is built
 * with textContent/createElement only (see h()); innerHTML is never used.
 * ==================================================================== */
const LIM = {title:300, assignee:120, labels:50, label:80, text:100000, criteria:200, criterion:1000};
const PRIORITIES = ['low','medium','high','urgent'];
const PRANK = {urgent:0, high:1, medium:2, low:3};
const ID_RE = /^AB-[0-9A-F]{12}$/;
const SLUG_RE = /^[a-z][a-z0-9-]{0,39}$/;
const TS_RE = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/;
const HASH_RE = /^[0-9a-f]{64}$/;
const TOKEN_RE = /^[A-Za-z0-9_-]{16,}$/;
const ITEM_KEYS = ['version','id','revision','title','status','priority','assignee','labels','description','acceptanceCriteria','notes','createdAt','updatedAt','archived','feature','thread'];
const WRITABLE = ['title','status','priority','assignee','labels','description','acceptanceCriteria','notes','archived','feature'];
const FEATURE_KEYS = ['version','id','revision','title','status','description','createdAt','updatedAt','archived'];
const POLL_MS = 1500;

const $ = (s, r = document) => r.querySelector(s);
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function featureWrite(action, onError = null) {
  const focusKey = document.activeElement?.dataset?.fk;
  if (S.writing) { toast('Another save is in progress.'); return false; }
  S.writing = true;
  renderBusy();
  try {
    await mutate(action);
    S.needsFresh = true;
    await pollFresh();
    return true;
  } catch (e) {
    if (onError) onError(e);
    else toast('Could not update feature: ' + e.message, {kind:'error'});
    if (e.kind === 'conflict') { S.needsFresh = true; await pollFresh(); }
    return false;
  } finally {
    S.writing = false;
    renderBusy();
    renderBoard();
    if (focusKey) focusFk(focusKey);
  }
}
function moveFeature(feature, status) {
  if (feature.status === status) return;
  return featureWrite(() => S.backend.patchFeature(feature.id, feature.revision, feature.hash, {status}));
}
function issueForm(title, fields, save) {
  const dialog = h('dialog', {class:'dlg'});
  const form = h('form', {});
  const inputs = {};
  form.append(h('h2', {text:title}));
  for (const [key, label, required] of fields) {
    const input = h(key === 'title' ? 'input' : 'textarea', {name:key, required:!!required});
    inputs[key] = input;
    form.append(h('label', {class:'field'}, h('span', {text:label}), input));
  }
  const error = h('p', {role:'alert'});
  const submit = h('button', {type:'submit', class:'btn primary'}, 'Save');
  const cancel = h('button', {type:'button', class:'btn', onclick:() => dialog.close()}, 'Cancel');
  form.append(error, h('div', {class:'dlg-actions'}, cancel, submit));
  form.addEventListener('submit', async event => {
    event.preventDefault(); submit.disabled = true; error.textContent = '';
    try {
      await save(Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, input.value])));
      dialog.close(); await pollFresh();
    } catch (e) { error.textContent = e.message || String(e); }
    finally { submit.disabled = false; }
  });
  dialog.addEventListener('close', () => dialog.remove());
  dialog.append(form); document.body.append(dialog); dialog.showModal();
}

    input.value = ''; d.pendingLabel = ''; render(); updateEditorControls();
    if (dup) announce(dup === 1 ? 'That label is already on the card.' : 'Duplicate labels were ignored.');
  };
  input.addEventListener('input', () => { d.pendingLabel = input.value; clearErr('labels'); updateEditorControls(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); } });
  render();
  return h('div', {class: 'field'}, h('label', {for: 'ed-labels'}, 'Labels'), list,
    h('div', {class: 'inline-add'}, input, h('button', {type: 'button', class: 'btn', onclick: () => { commit(); input.focus(); }}, 'Add')),
    h('div', {class: 'err', id: 'err-labels'}), h('span', {class: 'help', text: 'Unique, up to 50 labels of up to 80 characters. Comma also adds.'}));
}
function criteriaField(d) {
  const f = d.fields, ul = h('ul', {class: 'crit-list', id: 'ed-crit-list'}), sumEl = h('span', {class: 'muted', id: 'ed-crit-sum'});
  const addInput = h('input', {type: 'text', id: 'ed-crit-new', placeholder: 'Add acceptance criterion, press Enter', autocomplete: 'off', value: d.pendingCriterion, 'aria-label': 'New acceptance criterion'});
  const sum = () => { const n = f.criteria.length, k = f.criteria.filter(c => c.done).length; sumEl.textContent = n ? `${k} of ${n} done` : 'none yet'; };
  const change = () => { d.saveError = ''; sum(); updateEditorControls(); };
  const render = (focusSel) => {
    clear(ul);
    f.criteria.forEach((c, i) => {
      const cb = h('input', {type: 'checkbox', checked: c.done, 'aria-label': `Criterion ${i + 1} done`, onchange: () => { c.done = cb.checked; change(); }});
      const tx = h('input', {type: 'text', value: c.text, 'aria-label': `Criterion ${i + 1} text`, 'aria-describedby': 'err-crit-' + i, oninput: () => { c.text = tx.value; const er = $('#err-crit-' + i); if (er) er.textContent = ''; tx.removeAttribute('aria-invalid'); change(); }, onkeydown: e => { if (e.key === 'Enter') e.preventDefault(); }});
      const swap = (j) => { [f.criteria[i], f.criteria[j]] = [f.criteria[j], f.criteria[i]]; render(`#ed-crit-list li:nth-child(${j + 1}) .crit-text-btn-${j < i ? 'up' : 'down'}`); change(); };
      ul.append(h('li', {class: 'crit-row'}, cb, tx,
        h('span', {class: 'crit-btns'},
          h('button', {type: 'button', class: 'crit-text-btn-up', 'aria-label': `Move criterion ${i + 1} up`, disabled: i === 0, onclick: () => swap(i - 1)}, '↑'),
          h('button', {type: 'button', class: 'crit-text-btn-down', 'aria-label': `Move criterion ${i + 1} down`, disabled: i === f.criteria.length - 1, onclick: () => swap(i + 1)}, '↓'),
          h('button', {type: 'button', 'aria-label': `Remove criterion ${i + 1}`, onclick: () => { f.criteria.splice(i, 1); render(); change(); addInput.focus(); }}, '×')),
        h('div', {class: 'err', id: 'err-crit-' + i})));
    });
    if (focusSel) { const el = $(focusSel); if (el && !el.disabled) el.focus(); else { const alt = $(focusSel.replace(/-(up|down)$/, m => m === '-up' ? '-down' : '-up')); if (alt && !alt.disabled) alt.focus(); } }
    sum();
  };
  const add = () => { const t = addInput.value.trim(); if (!t) return; f.criteria.push({text: t, done: false}); addInput.value = ''; d.pendingCriterion = ''; render(); change(); addInput.focus(); };
  addInput.addEventListener('input', () => { d.pendingCriterion = addInput.value; updateEditorControls(); });
  addInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  render();
  return h('div', {class: 'field', role: 'group', 'aria-labelledby': 'crit-lbl'}, h('div', {class: 'lbl', id: 'crit-lbl'}, 'Acceptance criteria ', sumEl), ul,
    h('div', {class: 'inline-add'}, addInput, h('button', {type: 'button', class: 'btn', onclick: add}, 'Add')),
    h('div', {class: 'err', id: 'err-criteria'}));
}

function currentDraft() { return S.editing ? S.drafts.get(S.editing) : null; }
function updateEditorControls() {
  const d = currentDraft(); if (!d || !editor().open) return;
  const save = $('#ed-save'), note = $('#ed-note'), cancel = $('#ed-cancel'), copy = $('#ed-copy');
  if (!save) return;
  const dirty = isDirty(d);
  const blocked = !!d.conflict || !!d.savedItemId;
  save.disabled = S.writing || blocked || (!!d.id && !fieldDirty(d));
  save.textContent = S.writing ? 'Saving…' : d.id ? 'Save changes' : 'Create card';
  copy.hidden = !dirty;
  cancel.textContent = dirty ? 'Discard draft' : 'Cancel';
  note.textContent = d.savedItemId ? 'The card was saved; waiting to reload it before further edits.' : blocked ? 'Saving is disabled while this card is in conflict.' : S.conn.state === 'error' ? 'Offline: saving resumes when the connection returns. Your draft is kept.' : dirty ? 'Unsaved changes. “×” keeps the draft; “Discard draft” deletes it.' : d.id ? 'No changes yet.' : '';
}
function renderEditorAlerts(d) {
  const box = $('#ed-alerts'); if (!box) return; clear(box);
  if (d.conflict) box.append(conflictBanner(d));
  if (d.refreshed) box.append(alertBox('info', '', 'This card was changed on the board while you had no edits, so the form now shows the latest version.'));
  if (d.saveError) box.append(alertBox('error', 'Could not save', d.saveError));
}
function onEditorSync() {
  const d = currentDraft(); if (!d || !editor().open) return;
  if ($('#thread-list')) $('#thread-list').refreshEntries();
  if (S.writing) { renderEditorAlerts(d); updateEditorControls(); return; }
  if (d.refreshed && $('#thread-panel') && ($('#thread-panel').contains(document.activeElement) || [...$('#thread-panel').querySelectorAll('textarea, input')].some(t => t.value || t.closest('.thread-entry')))) {
    const panel = $('#thread-panel');
    const active = panel.contains(document.activeElement) ? document.activeElement : null;
    const start = active?.selectionStart, end = active?.selectionEnd;
    const y = $('.ed-body').scrollTop;
    buildEditor(d);
    $('#thread-panel').replaceWith(panel);
    $('.ed-body').scrollTop = y;
    if (active) {
      active.focus();
      if (start != null && end != null) active.setSelectionRange(start, end);
    }
    return;
  }
  if (d.refreshed) { const y = $('.ed-body') ? $('.ed-body').scrollTop : 0; buildEditor(d); if ($('.ed-body')) $('.ed-body').scrollTop = y; announce('This card was updated on the board; the editor now shows the latest version.'); }
  else { renderEditorAlerts(d); updateEditorControls(); if (d.conflict && !d.conflict.ack) announce(d.conflict.kind === 'deleted' ? 'Conflict: this card was removed from the board. Your draft is kept.' : 'Conflict: this card changed on the board while you were editing. Your draft is kept and nothing was saved.'); }
}
function conflictBanner(d) {
  const c = d.conflict, copyBtn = h('button', {type: 'button', class: 'btn small', onclick: async () => { const ok = await copyText(draftText(d)); toast(ok ? 'Draft copied to clipboard.' : 'Clipboard unavailable — open “Show draft as text” and copy it from there.', {kind: ok ? 'ok' : 'error'}); }}, 'Copy draft');
  const ta = h('textarea', {readOnly: true, rows: 8, 'aria-label': 'Draft as text', id: 'draft-text'}); ta.value = draftText(d);
  const details = h('details', {class: 'draft-text'}, h('summary', {text: 'Show draft as text'}), ta);
  if (c.ack) return h('div', {class: 'alert error', role: 'alert', id: 'conflict-banner'}, h('span', {class: 'a-icon', 'aria-hidden': 'true'}, '⚠'),
    h('div', {class: 'a-body'}, h('h3', {text: 'Conflict — saving is disabled'}),
      h('p', {text: 'This card changed on the board after you started editing. Your draft is kept; nothing has been overwritten.'}),
      h('div', {class: 'a-actions'}, h('button', {type: 'button', class: 'btn small', id: 'cf-review', onclick: () => { c.ack = false; renderEditorAlerts(d); const b = $('#cf-keep'); if (b) b.focus(); }}, 'Review options'), copyBtn), details));
  let heading, text;
  if (c.kind === 'deleted') { heading = 'This card is no longer on the board'; text = 'Its file was removed while you were editing. Your draft is kept.'; }
  else if (c.kind === 'server') { heading = 'The save was rejected: the card changed elsewhere'; text = 'The server refused the save (HTTP 409) because the card was modified after you opened it. Your whole draft is kept and nothing was saved.'; }
  else { heading = 'This card changed while you were editing'; text = `Someone or something updated it on the board (revision ${d.base.revision} → ${c.live.revision}). Your whole draft is kept and nothing was saved.`; }
  const names = c.live ? changedFieldNames(d.base, c.live) : [];
  const keep = h('button', {type: 'button', class: 'btn small primary', id: 'cf-keep', onclick: () => { c.ack = true; renderEditorAlerts(d); renderDrafts(); const t = $('#ed-title'); if (t) t.focus(); }}, 'Keep editing my draft');
  const reload = c.kind === 'deleted'
    ? h('button', {type: 'button', class: 'btn small danger', id: 'cf-reload', onclick: async () => { if (await confirmDialog({title: 'Discard draft and close?', message: `This permanently discards your unsaved draft for ${d.id}.`, confirmLabel: 'Discard draft', cancelLabel: 'Keep draft'})) { S.drafts.delete(d.key); closeEditorUi(); } }}, 'Discard draft and close')
    : h('button', {type: 'button', class: 'btn small danger', id: 'cf-reload', onclick: () => reloadCurrent(d)}, 'Reload current card…');
  return h('div', {class: 'alert error', role: 'alert', id: 'conflict-banner'}, h('span', {class: 'a-icon', 'aria-hidden': 'true'}, '⚠'),
    h('div', {class: 'a-body'}, h('h3', {text: heading}), h('p', {text}),
      names.length ? h('p', {class: 'muted', text: 'Changed on the board: ' + names.join(', ') + '. Version 1 does not merge or diff automatically; compare by hand.'}) : h('p', {class: 'muted', text: 'Version 1 does not merge or diff automatically.'}),
      h('div', {class: 'a-actions'}, keep, reload, copyBtn), details));
}
async function reloadCurrent(d) {
  if (!await confirmDialog({title: 'Discard your draft?', message: `Reloading shows the current version of ${d.id} and permanently discards your unsaved changes. Copy the draft first if you want to keep them.`, confirmLabel: 'Discard draft and reload', cancelLabel: 'Keep my draft'})) { const b = $('#cf-reload'); if (b) b.focus(); return; }
  if (!await pollFresh().catch(() => false) && !S.snap.items.get(d.id)) return toast('Cannot reach the board; your draft is kept.', {kind: 'error'});
  const live = S.snap.items.get(d.id);
  if (!live) { d.conflict = {kind: 'deleted', live: null, ack: false}; renderEditorAlerts(d); return; }
  d.threadBody = ''; d.threadAuthor = ''; d.threadInputs = {};
  d.base = live; d.fields = fieldsFrom(live); d.pendingLabel = ''; d.pendingCriterion = ''; d.conflict = null; d.refreshed = false; d.saveError = '';
  buildEditor(d); renderDrafts(); renderBoard(); announce('Loaded the current version of the card; your draft was discarded.');
  const t = $('#ed-title'); if (t) t.focus();
}
async function cancelDraft(d) {
  if (isDirty(d) && !await confirmDialog({title: 'Discard draft?', message: d.id ? `Your unsaved changes to ${d.id} will be lost.` : 'This new card has not been created. Its contents will be lost.', confirmLabel: 'Discard draft', cancelLabel: 'Keep editing'})) return;
  d.threadBody = ''; d.threadAuthor = ''; d.threadInputs = {};
  S.drafts.delete(d.key); closeEditorUi();
}

function showFieldErrors(e) {
  const set = (name, msg) => { const er = $('#err-' + name), inp = $('#ed-' + name); if (er) er.textContent = msg; if (inp) inp.setAttribute('aria-invalid', 'true'); };
  let first = null;
  for (const k of ['title', 'status', 'priority', 'assignee', 'labels', 'description', 'criteria', 'notes']) if (e[k]) { set(k, e[k]); first = first || $(k === 'criteria' ? '#ed-crit-new' : '#ed-' + k); }
  for (const [i, msg] of Object.entries(e.crit)) { const er = $('#err-crit-' + i), inp = er && er.parentElement.querySelector('input[type=text]'); if (er) er.textContent = msg; if (inp) { inp.setAttribute('aria-invalid', 'true'); first = first || inp; } }
  if (first) first.focus();
}
function commitPending(d) {
  const l = d.pendingLabel.split(',').map(s => s.trim()).filter(Boolean);
  for (const x of l) if (!d.fields.labels.includes(x)) d.fields.labels.push(x);
  d.pendingLabel = '';
  const c = d.pendingCriterion.trim(); if (c) d.fields.criteria.push({text: c, done: false}); d.pendingCriterion = '';
  buildEditor(d);
}
async function saveDraft(d) {
  if (S.writing || d.conflict || d.savedItemId) return;
  if (d.pendingLabel.trim() || d.pendingCriterion.trim()) commitPending(d);
  const errs = validateDraft(d);
  if (hasErrors(errs)) { showFieldErrors(errs); return; }
  const f = d.fields, key = d.key;
  S.writing = true; d.saveError = ''; renderBusy(); renderEditorAlerts(d);
  try {
    await ensureFresh();
    let createdId = null;
    if (d.id) {
      const live = S.snap.items.get(d.id);
      if (!live) { d.conflict = {kind: 'deleted', live: null, ack: false}; renderEditorAlerts(d); onEditorSync(); return; }
      if (live.hash !== d.base.hash || live.revision !== d.base.revision) { syncDraft(d); renderEditorAlerts(d); renderDrafts(); announce('Conflict: this card changed on the board. Your draft is kept; nothing was saved.'); return; }
      const changes = computeChanges(d);
      if (!Object.keys(changes).length) {
        if (!isDirty(d)) S.drafts.delete(key);
        closeEditorUi();
        return;
      }
      await mutate(() => S.backend.patch(d.id, d.base.revision, d.base.hash, changes));
    } else {
      const values = {title: f.title.trim(), status: f.status, priority: f.priority, assignee: f.assignee.trim() || null, labels: f.labels.slice(), description: f.description, acceptanceCriteria: f.criteria.map(c => ({text: c.text.trim(), done: c.done})), notes: f.notes, feature: f.feature};
      createdId = (await createCard(values)).id;
    }
    S.needsFresh = true; await pollFresh();
    if (d.id && (d.threadBody || d.threadAuthor || Object.keys(d.threadInputs || {}).length)) {
      const live = S.snap.items.get(d.id);
      if (live) { d.base = live; d.fields = fieldsFrom(live); d.conflict = null; }
    } else S.drafts.delete(key);
    S.returnFocus = (createdId || d.id) + ':title';
    if (S.editing === key) closeEditorUi();
    const msg = createdId ? `Created ${createdId}.` : `Saved ${d.id}.`;
    toast(msg, {kind: 'ok'}); announce(msg);
  } catch (e) {
    if (e.kind === 'feature_sync_failed' && e.itemId) {
      if (d.id && (d.threadBody || d.threadAuthor || Object.keys(d.threadInputs || {}).length)) { d.savedItemId = e.itemId; d.keepThreadDraft = true; }
      else S.drafts.delete(key);
      if (S.editing === key) closeEditorUi();
      S.needsFresh = true;
      pollFresh().catch(() => {});
      toast(e.message, {kind: 'error', persistent: true});
      announce(e.message);
    } else if (conflictFromError(e) && d.id) {
      // Warn immediately; the fresh snapshot (fetched in the background) then fills in what changed via syncDraft().
      d.conflict = {kind: 'server', live: null, ack: false}; d.saveError = '';
      S.needsFresh = true; pollFresh().catch(() => {});
      renderEditorAlerts(d); renderDrafts(); updateEditorControls(); announce('Save rejected: the card changed on the board. Your draft is kept; nothing was saved.');
    } else {
      d.saveError = (e.message || 'Unexpected error') + ' Your draft is kept.';
      renderEditorAlerts(d);
    }
  } finally { S.writing = false; renderBusy(); }
}

/* ====================================================================
 * Mode selection & wiring
 * ==================================================================== */
async function pickFolder() {
  let handle;
  try { handle = await window.showDirectoryPicker({id: 'agentboard', mode: 'readwrite'}); }
  catch (e) { if (e && e.name === 'AbortError') return; S.launchNote = 'Could not open the folder: ' + (e && e.message || e); renderBoard(); return; }
  try {
    const backend = await directBackend(handle);
    clearTimeout(pollTimer); S.backend = backend; S.mode = 'direct'; S.snap = null; S.launchNote = '';
    S.conn = {state: 'connecting', failures: 0, lastOk: 0, message: '', kind: '', nextAt: 0};
    renderAll(); poll();
  } catch (e) { S.launchNote = e.message || 'Could not open that folder.'; S.mode = 'launch'; renderAll(); }
}
function startFromHash() {
  const raw = new URLSearchParams(location.hash.replace(/^#/, '')).get('token');
  if (raw === null) { S.mode = 'launch'; return false; }
  if (!TOKEN_RE.test(raw)) { S.mode = 'launch'; S.launchNote = 'The #token in this URL looks malformed. Copy the complete URL printed by “serve”.'; return false; }
  S.backend = bridgeBackend(raw); S.mode = 'bridge';
  return true;
}

function wire() {
  for (const view of ['board', 'features', 'issues']) $('#view-' + view).addEventListener('click', () => { S.view = view; renderAll(); });
  $('#new-feature').addEventListener('click', () => openFeature());
  $('#feature-archived').addEventListener('change', e => { S.showArchivedFeatures = e.target.checked; renderBoard(); });
  $('#skip').addEventListener('click', () => $('#board').focus());
  $('#new-card').addEventListener('click', () => openEditor('new', {returnFocus: 'new-card'}));
  $('#conn-retry').addEventListener('click', () => pollNow());
  const q = $('#q');
  q.addEventListener('input', () => { S.filters.q = q.value; renderBoard(); $('#f-clear').hidden = !(filtersActive() || S.filters.archived !== 'hide'); });
  for (const [id, k] of [['f-priority', 'priority'], ['f-assignee', 'assignee'], ['f-label', 'label'], ['f-feature', 'feature'], ['f-archived', 'archived']])
    $('#' + id).addEventListener('change', e => { S.filters[k] = e.target.value; renderToolbar(); renderBoard(); });
  $('#f-clear').addEventListener('click', () => { clearFilters(); q.focus(); });
  $('#ed-form').addEventListener('submit', e => { e.preventDefault(); const d = currentDraft(); if (d) saveDraft(d); });
  editor().addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); const d = currentDraft(); if (d) saveDraft(d); } });
  editor().addEventListener('close', () => {
    const key = S.editing; S.editing = null;
    const d = key && S.drafts.get(key);
    if (d && !d.keepThreadDraft && !isDirty(d)) S.drafts.delete(key);
    renderDrafts(); renderBoard();
    if (!focusFk(S.returnFocus)) { const n = S.returnFocus === 'new-card' ? $('#new-card') : null; (n || $('#board')).focus(); }
  });
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('dialog[open]')) return;
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (typing) { if (e.key === 'Escape' && t.id === 'q' && t.value) { t.value = ''; S.filters.q = ''; renderBoard(); } return; }
    if (e.key === '/' && S.snap && S.view === 'board') { e.preventDefault(); $('#q').focus(); }
    else if (e.key === 'n' && S.snap) { e.preventDefault(); openEditor('new', {returnFocus: 'new-card'}); }
  });
  window.addEventListener('focus', pollNow);
  window.addEventListener('online', pollNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pollNow(); });
  window.addEventListener('hashchange', () => {
    const raw = new URLSearchParams(location.hash.replace(/^#/, '')).get('token');
    if (raw !== null && S.mode !== 'direct') location.reload();
  });
  window.addEventListener('beforeunload', e => { if ([...S.drafts.values()].some(isDirty)) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(() => { if (S.conn.state === 'error') renderConn(); }, 1000);
}

wire();
if (startFromHash()) { renderAll(); poll(); } else renderAll();
})();
</script>
