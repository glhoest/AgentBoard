name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run the release workflow on main.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must be a stable tag such as v1.0.0.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'Tag already exists; choose a new version.' >&2
            exit 1
          fi
          printf '{"version":"%s"}\n' "$RELEASE_TAG" > .agentboard-release.json
          tar -czf agentboard.tar.gz .agentboard-release.json SKILL.md README.md LICENSE agents assets scripts
          gh release create "$RELEASE_TAG" agentboard.tar.gz --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
