name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Build and smoke-test release
        env:
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run the release workflow on main.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must be a stable tag such as v1.0.0.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'Tag already exists; choose a new version.' >&2
            exit 1
          fi
          bun .github/scripts/package-distribution.ts "$GITHUB_SHA" --stable release "$RELEASE_TAG"
          mkdir -p smoke
          tar -xzf release/agentboard-no-update.tar.gz -C smoke
          bun smoke/scripts/agentboard.ts --help | grep -q 'no-update build'
          mkdir smoke-project
          bun smoke/scripts/agentboard.ts setup smoke-project
          bun smoke-project/.agents/skills/agentboard/scripts/agentboard.ts --root smoke-project list
          if bun smoke-project/.agents/skills/agentboard/scripts/agentboard.ts update; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: |
            release/agentboard.tar.gz
            release/agentboard-no-update.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release create "$RELEASE_TAG" agentboard.tar.gz agentboard-no-update.tar.gz --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
