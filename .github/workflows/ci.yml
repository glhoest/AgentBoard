name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: CLI and library tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Run CLI and library tests
        run: bun test tests/ts

  e2e:
    name: Chrome end-to-end tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Require Chrome
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw 'Chrome is required for the browser suite' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Chrome end-to-end tests
        run: bun test tests/ui.test.ts
