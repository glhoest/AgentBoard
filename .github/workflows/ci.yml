name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?:[[:space:]][^[:space:]].*$ ]]; then
            echo 'Use a conventional title, for example: fix: handle missing board' >&2
            exit 1
          fi

  test:
    name: CLI and library tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Run CLI and library tests
        run: bun test --retry=3 tests/ts

  e2e:
    name: Chrome end-to-end tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Require Chrome
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw 'Chrome is required for the browser suite' }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Chrome end-to-end tests
        run: bun test --retry=3 tests/ui.test.ts
